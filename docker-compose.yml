services:
  db:
    image: postgres:15
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  web:
    image: nova-pat-web:latest            # usa/gera a imagem com este nome
    build:
      context: .
      cache_from:
        - nova-pat-web:latest            # reaproveita camadas da imagem local ao buildar
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - PYTHONUNBUFFERED=1           # Garante que o log do terminal atualize na hora
      - WATCHMAN_USE_POLLING=true    # Força a verificação de mudanças em sistemas de arquivos montados
      - RUN_MIGRATIONS=1             # Executa migrate no entrypoint (ativo em dev)
      # - COLLECTSTATIC=1            # Habilite manualmente se quiser coletar estáticos na inicialização
    depends_on:
      - db

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    container_name: nova-pat-playwright-mcp
    entrypoint: node
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - "0.0.0.0"
    ports:
      - "8931:8931"
    init: true
    restart: unless-stopped

  django-boost:
    image: nova-pat-web:latest
    container_name: nova-pat-django-boost
    command: >
      django-ai-boost
        --settings mysite.settings.dev
        --transport sse
        --host 0.0.0.0
        --port 8001
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
    depends_on:
      - db
    restart: unless-stopped