<section class="mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 lg:px-8"
         role="region" aria-label="{{ value.titulo_secao }}">
    <h2 class="text-2xl font-bold text-gray-900 sm:text-3xl">
        {{ value.titulo_secao }}
    </h2>

    <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        {% for item in value.itens %}
            <a href="{{ item.link_url|default:'#' }}"
               aria-label="{{ item.titulo }}"
               class="group rounded-lg bg-white p-6 shadow-sm ring-1 ring-gray-200 transition-shadow hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2">
                {% if item.icone %}
                    <span class="inline-flex h-12 w-12 items-center justify-center rounded-md bg-brand-50 text-2xl text-brand-600"
                          aria-hidden="true">
                        {{ item.icone }}
                    </span>
                {% endif %}
                <h3 class="mt-4 text-lg font-semibold text-gray-900">
                    {{ item.titulo }}
                </h3>
                {% if item.texto %}
                    <p class="mt-2 text-sm leading-relaxed text-gray-600">
                        {{ item.texto }}
                    </p>
                {% endif %}
            </a>
        {% endfor %}
    </div>
</section>
