{% load wagtailimages_tags %}
<section class="relative w-full overflow-hidden bg-brand-700"
         role="region" aria-label="{{ value.titulo }}">
    {% if value.imagem %}
        {% image value.imagem fill-1920x600 as banner_img %}
        <img src="{{ banner_img.url }}" alt=""
             class="absolute inset-0 h-full w-full object-cover"
             aria-hidden="true" />
    {% endif %}
    <div class="absolute inset-0 bg-black/50" aria-hidden="true"></div>

    <div class="relative z-10 mx-auto w-full max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
        <div class="max-w-3xl">
            <h2 class="text-3xl font-bold leading-tight text-white sm:text-4xl">
                {{ value.titulo }}
            </h2>

            {% if value.texto %}
                <p class="mt-4 text-lg leading-relaxed text-white/90">
                    {{ value.texto }}
                </p>
            {% endif %}

            {% if value.link_texto %}
                <a href="{{ value.link_url|default:'#' }}"
                   aria-label="{{ value.link_texto }}"
                   class="mt-8 inline-flex items-center justify-center rounded-md bg-white px-6 py-3 text-base font-semibold text-brand-700 shadow-sm transition-colors hover:bg-brand-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-brand-700">
                    {{ value.link_texto }}
                </a>
            {% endif %}
        </div>
    </div>
</section>
