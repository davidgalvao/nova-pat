[pytest]
DJANGO_SETTINGS_MODULE = mysite.settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = TestCase
python_functions = test_*
addopts = --import-mode=append
testpaths = 
    conteudos/tests
    canais/tests
    core/tests
    curriculo/tests
    series/tests
    aplicativos/tests
    interacoes/tests
    usuarios/tests
    search/tests
    home