{% extends "conteudos/conteudo_page_base.html" %}
{% load wagtailcore_tags conteudos_tags %}

{% block conteudo_player %}
<div class="conteudo-player documento-player">
    {% if page.arquivo %}
    <div class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="text-sm text-gray-600">
                <span class="font-semibold text-gray-800">Arquivo:</span>
                <span class="break-all">{{ page.arquivo.name|filename }}</span>
            </div>
            <a
                href="{{ page.arquivo.url }}"
                download
                class="inline-flex items-center justify-center gap-2 rounded-md bg-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                Baixar documento
            </a>
        </div>
    </div>
    {% else %}
    <div class="flex items-center justify-center rounded-lg border-2 border-dashed border-gray-300 bg-gray-100 p-12 text-center">
        <p class="text-gray-600">Documento não disponível no momento.</p>
    </div>
    {% endif %}
</div>
{% endblock %}
