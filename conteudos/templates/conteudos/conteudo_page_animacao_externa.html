{% extends "conteudos/conteudo_page_base.html" %}
{% load wagtailcore_tags wagtailembeds_tags %}

{% block conteudo_player %}
<div class="conteudo-player animacao-externa-player">
    {% if page.source %}
    <div class="rounded-lg border border-gray-200 bg-white shadow-sm overflow-hidden">
        {% comment %}
        URL colada pelo gestor (ex.: youtube.com/watch?v=ID, youtu.be/ID, /shorts, vimeo.com/ID)
        não funciona direto em <iframe src> (X-Frame-Options). Resolver via oEmbed: a tag embed
        captura EmbedException e devolve vazio quando o provider não é suportado, caindo no
        fallback de link seguro abaixo. O dimensionamento é forçado por CSS porque a tag entrega
        o iframe no tamanho padrão do provider (ex.: 200x113).
        {% endcomment %}
        {% embed page.source as embed_html %}
        {% if embed_html %}
        <div class="relative w-full bg-black" style="aspect-ratio: 16 / 9;">
            <div class="absolute inset-0 [&>iframe]:h-full [&>iframe]:w-full [&>iframe]:border-0">
                {{ embed_html }}
            </div>
        </div>
        {% endif %}

        {# Fallback de link externo seguro #}
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4">
            <p class="text-sm text-gray-600">
                {% if embed_html %}
                    Problemas para carregar? Acesse diretamente pelo link abaixo.
                {% else %}
                    Este endereço não oferece incorporação direta. Acesse pelo link abaixo.
                {% endif %}
            </p>
            <a
                href="{{ page.source }}"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center justify-center gap-2 rounded-md bg-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                Abrir em nova aba
                <span class="sr-only">(abre em nova aba)</span>
            </a>
        </div>
    </div>
    {% else %}
    <div class="flex items-center justify-center rounded-lg border-2 border-dashed border-gray-300 bg-gray-100 p-12 text-center">
        <p class="text-gray-600">Animação externa não disponível no momento.</p>
    </div>
    {% endif %}
</div>
{% endblock %}
