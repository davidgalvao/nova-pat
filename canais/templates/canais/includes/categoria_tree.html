{% load wagtailcore_tags %}

<li class="categoria-item">
    <span>{{ categoria.name }}</span>
    {% if categoria.subcategorias.all %}
    <ul class="categoria-children">
        {% for child in categoria.subcategorias.all %}
        {% include "canais/includes/categoria_tree.html" with categoria=child %}
        {% endfor %}
    </ul>
    {% endif %}
</li>
