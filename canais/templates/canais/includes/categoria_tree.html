{% load wagtailcore_tags %}

<li class="categoria-item">
    <a href="{{ categoria.get_absolute_url }}" class="categoria-link">
        {{ categoria.name }}
    </a>
    {% if categoria.get_children %}
    <ul class="categoria-children">
        {% for child in categoria.get_children %}
        {% include "canais/includes/categoria_tree.html" with categoria=child %}
        {% endfor %}
    </ul>
    {% endif %}
</li>
