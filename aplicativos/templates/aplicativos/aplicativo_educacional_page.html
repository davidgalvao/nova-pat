{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block body_class %}template-aplicativo{% endblock %}

{% block content %}
<main role="main">
    <h1>{{ page.title }}</h1>

    {% if page.description %}
    <div>{{ page.description|richtext }}</div>
    {% endif %}

    <a href="{{ page.url }}" target="_blank" rel="noopener">Acessar aplicativo</a>
</main>
{% endblock %}
